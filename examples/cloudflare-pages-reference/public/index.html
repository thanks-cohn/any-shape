<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deployment Lab</title><style>body{font:16px/1.5 system-ui;max-width:650px;margin:5vh auto;padding:20px}label,input,textarea,button{display:block;width:100%;margin:10px 0}input,textarea,button{font:inherit;padding:10px}pre{white-space:pre-wrap;word-break:break-word}</style><h1>Cloudflare Pages Submission Lab</h1><p>Reference respondent page; use synthetic data.</p><form id="form"><label>Form ID<input name="formId" value="lab-studio" required></label><label>Test answer<textarea name="answer" required>Hello from the deployment lab</textarea></label><label>Optional attachments<input type="file" name="files" multiple></label><button>Submit test record</button></form><pre id="result" role="status"></pre><script>document.getElementById("form").addEventListener("submit",async(e)=>{e.preventDefault();const fd=new FormData(e.target);const output=document.getElementById("result");output.textContent="Sending...";try{const body=new FormData();body.append("submission",JSON.stringify({formId:fd.get("formId"),answers:{answer:fd.get("answer")}}));for(const file of fd.getAll("files"))if(file instanceof File && file.size)body.append("files",file);const r=await fetch("/api/submit",{method:"POST",body});const result=await r.json();output.textContent=JSON.stringify({httpStatus:r.status,...result},null,2)}catch(err){output.textContent="Network failure: "+err.message}})</script></html>
